<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký thành công</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 50px;
            text-align: center;
        }

        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            color: green;
        }

        p {
            font-size: 18px;
            margin: 10px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Đăng ký thành công!</h2>

    <p>Firstname: <span th:text="${user.firstname}"></span></p>
    <p>Lastname: <span th:text="${user.lastname}"></span></p>
    <p>Phone: <span th:text="${user.phoneNumber}"></span></p>
    <p>Age: <span th:text="${user.age}"></span></p>
    <p>Email: <span th:text="${user.email}"></span></p>

    <a th:href="@{/}">Quay lại đăng ký</a>

</div>

</body>
</html>
