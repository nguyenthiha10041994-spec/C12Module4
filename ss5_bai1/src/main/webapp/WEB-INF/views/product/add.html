<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Add Product</title>
</head>
<body>
<h1>Add New Product</h1>
<form th:action="@{/products/create}"
      th:object="${product}"
      method="post">
  <div>
    <label>Name:</label>
    <input type="text" th:field="*{name}">
  </div>
  <br>
  <div>
    <label>Price:</label>
    <input type="number"
           step="0.01"
           th:field="*{price}">
  </div>
  <br>
  <div>
    <label>Description:</label>
    <input type="text"
           th:field="*{description}">
  </div>
  <br>
  <div>
    <label>Manufacturer:</label>
    <input type="text"
           th:field="*{manufacturer}">
  </div>
  <br>
  <button type="submit">
    Save
  </button>
</form>
<br>
<a th:href="@{/products}">
  Back to Product List
</a>
</body>
</html>
